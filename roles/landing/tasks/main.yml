---
# Landing Page Role - Static site via Caddy

- name: Install git
  apt:
    name: git
    state: present
    update_cache: true

- name: Install Caddy dependencies
  apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    state: present
    update_cache: true

- name: Add Caddy GPG key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    mode: '0644'

- name: Add Caddy repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    state: present
    filename: caddy-stable

- name: Install Caddy
  apt:
    name: caddy
    state: present
    update_cache: true

- name: Create web root directory
  file:
    path: "{{ landing_web_root }}"
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'

- name: Update site_content from git repository
  git:
    repo: "{{ site_content_repo | default('https://github.com/dyne/conspire-site.git') }}"
    dest: "{{ landing_web_root }}/"
    version: "{{ site_content_version | default('master') }}"
    force: true
  notify: Reload Caddy

- name: Deploy Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  notify: Reload Caddy

- name: Create Caddy log directory
  file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'

- name: Enable and start Caddy
  systemd:
    name: caddy
    enabled: true
    state: started

# Firewall
- name: Allow HTTP through firewall
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Allow HTTPS through firewall
  ufw:
    rule: allow
    port: '443'
    proto: tcp
