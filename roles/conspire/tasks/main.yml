---
# Conspire Binary Role - Ephemeral Anonymous Chat
# https://dyne.org/conspire/
# Native binary deployment on port 8443

- name: Add universe repository
  ansible.builtin.apt_repository:
    repo: "deb http://archive.ubuntu.com/ubuntu/ jammy universe"
    state: present

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Install certbot via snap
  community.general.snap:
    name:
      - certbot
    classic: true

- name: Create conspire system user
  ansible.builtin.user:
    name: conspire
    system: true
    shell: /usr/sbin/nologin
    home: "{{ conspire_config_dir }}"
    create_home: false

- name: Create Conspire directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ conspire_config_dir }}"
    - "{{ conspire_config_dir }}/cert"

# Download latest release
- name: Get latest Conspire release info
  ansible.builtin.uri:
    url: https://api.github.com/repos/dyne/conspire/releases/latest
    return_content: yes
  register: conspire_release
  when: not ansible_check_mode

- name: Extract release download URL and version
  ansible.builtin.set_fact:
    conspire_download_url: "{{ conspire_release.json.assets | selectattr('name', 'equalto', 'conspire-x86_64') | map(attribute='browser_download_url') | first }}"
    conspire_version: "{{ conspire_release.json.tag_name }}"
  when: not ansible_check_mode

- name: Create temporary directory for downloads
  ansible.builtin.file:
    path: "{{ conspire_config_dir }}/tmp"
    state: directory
    mode: '0755'
  when: not ansible_check_mode

- name: Download Conspire binary
  get_url:
    url: "{{ conspire_download_url }}"
    dest: "{{ conspire_config_dir }}/tmp/conspire-x86_64"
    mode: '0644'
  register: conspire_downloaded
  when: not ansible_check_mode

- name: Download source tarball for frontend assets
  unarchive:
    src: "https://github.com/dyne/conspire/archive/{{ conspire_version }}.tar.gz"
    dest: "{{ conspire_config_dir }}/tmp/"
    remote_src: yes
    creates: "{{ conspire_config_dir }}/tmp/conspire-{{ conspire_version | regex_replace('^v', '') }}/front"
  when: not ansible_check_mode

- name: Move binary to final location
  copy:
    src: "{{ conspire_config_dir }}/tmp/conspire-x86_64"
    dest: "{{ conspire_config_dir }}/conspire"
    remote_src: yes
    owner: root
    group: root
    mode: '0755'
  when: conspire_downloaded.changed and ansible_check_mode != true

- name: Copy frontend directory
  copy:
    src: "{{ conspire_config_dir }}/tmp/conspire-{{ conspire_version | regex_replace('^v', '') }}/front/"
    dest: "{{ conspire_config_dir }}/front/"
    remote_src: yes
    owner: conspire
    group: conspire
    mode: '0755'
  when: not ansible_check_mode

- name: Cleanup temporary directory
  file:
    path: "{{ conspire_config_dir }}/tmp"
    state: absent
  when: not ansible_check_mode

# TLS certificates via Let's Encrypt
- name: Stop conspire for certbot
  systemd:
    name: conspire
    state: stopped
  failed_when: false

- name: Open port 80 temporarily for certbot
  ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Obtain Let's Encrypt certificate
  command: >
    certbot certonly --standalone
    --non-interactive --agree-tos
    --email {{ certbot_email }}
    -d {{ conspire_domain }}
  args:
    creates: "/etc/letsencrypt/live/{{ conspire_domain }}/fullchain.pem"

- name: Close port 80
  ufw:
    rule: deny
    port: '80'
    proto: tcp

- name: Copy fullchain certificate
  copy:
    src: "/etc/letsencrypt/live/{{ conspire_domain }}/fullchain.pem"
    dest: "{{ conspire_config_dir }}/cert/fullchain.pem"
    remote_src: yes
    owner: conspire
    group: conspire
    mode: '0644'
  notify: Restart Conspire
  when: not ansible_check_mode

- name: Copy private key
  copy:
    src: "/etc/letsencrypt/live/{{ conspire_domain }}/privkey.pem"
    dest: "{{ conspire_config_dir }}/cert/privkey.pem"
    remote_src: yes
    owner: conspire
    group: conspire
    mode: '0600'
  notify: Restart Conspire
  when: not ansible_check_mode

# Firewall - port 8443 for Conspire
- name: Allow Conspire port through UFW
  ufw:
    rule: allow
    port: '{{ conspire_port }}'
    proto: tcp

# Systemd service
- name: Install Conspire systemd service
  template:
    src: conspire.service.j2
    dest: /etc/systemd/system/conspire.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart Conspire
  when: not ansible_check_mode

- name: Enable and start Conspire service
  systemd:
    name: conspire
    state: started
    enabled: true
    daemon_reload: true
  when: not ansible_check_mode

# Certificate renewal hook
- name: Create certbot renewal hooks directory
  file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    mode: '0755'

- name: Create certbot renewal hook for Conspire
  copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/conspire-cert-update.sh
    content: |
      #!/bin/bash
      cp /etc/letsencrypt/live/{{ conspire_domain }}/fullchain.pem {{ conspire_config_dir }}/cert/fullchain.pem
      cp /etc/letsencrypt/live/{{ conspire_domain }}/privkey.pem {{ conspire_config_dir }}/cert/privkey.pem
      chown conspire:conspire {{ conspire_config_dir }}/cert/*.pem
      chmod 644 {{ conspire_config_dir }}/cert/fullchain.pem
      chmod 600 {{ conspire_config_dir }}/cert/privkey.pem
      systemctl restart conspire
    owner: root
    group: root
    mode: '0755'

- name: Ensure certbot timer is enabled
  systemd:
    name: certbot.timer
    state: started
    enabled: true
  ignore_errors: true
